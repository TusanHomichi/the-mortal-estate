# Lattermead: a hamlet, and the old hall on the rise above it, which burned.
# In Lately the hall stands whole and the hamlet is younger: the tavern and
# the green house aren't built yet, and the trees are saplings.
#
# Points are [east, north] in metres from the middle of the map. Models are
# under assets/models/; the KayKit kits are scaled to one size: people at
# 0.5, the dungeon and graveyard kits at 0.5, the hexagon kit at 4.

name = "Lattermead"
bounds = [[-32.0, -24.0], [32.0, 24.0]]
arrival = [-14.0, -3.0]

[ground]
living = "#5b8a46"
lately = "#3f6461"

# The arch by the graves, where the two sides touch.
[[threshold]]
at = [2.0, 17.0]
radius_m = 1.6
exit = [2.0, 14.5]

# A dun keeps to the old hall.
[[lair]]
kind = "dun"
at = [17.0, 9.0]
side = "living"

