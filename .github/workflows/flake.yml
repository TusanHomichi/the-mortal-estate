# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@4f941f7e6d966f6ec18578eea8bab0a804b89e0a # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # What no check but the link checker and gitleaks reads (no crate
      # includes a Markdown file): a PR touching only these skips the Rust
      # build and tests and gets those two alone.
      docs-paths: README.md AGENTS.md CLAUDE.md docs/**
      docs-checks: links secrets
