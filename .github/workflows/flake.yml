# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@4259ba07f47d2d0191a9873aef0f0e390fe272b6 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
