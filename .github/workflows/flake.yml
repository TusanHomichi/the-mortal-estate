# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@c4aeb5e39a46ff479932d019d00ff8116e95fe72 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
