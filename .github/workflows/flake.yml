# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  # A push to conary/train/ is a candidate of the merge train (main with the
  # PRs in it on top): the gate runs on the tree that would land and attests
  # it, which is what conaryd counts.
  push:
    branches: [main, "conary/train/**"]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@18976c2adc38f19315d91b9f0113b35eecd9c075 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # What no check but the link checker and gitleaks reads (no crate
      # includes a Markdown file): a PR touching only these skips the Rust
      # build and tests and gets those two alone.
      docs-paths: README.md AGENTS.md CLAUDE.md docs/**
      docs-checks: links secrets
      # Names this gate in what it attests, so a later push of the same tree
      # can be matched to it. Only main's push asks remi's lookup, and on a
      # hit it builds nothing (burrow's flake-check README, "Reusing an
      # attested pass"). The URL is the public one: GitHub hosts the runners.
      gate-reuse: true
      gate-reuse-lookup: https://remi.fieldmouseworks.com/conary/gate-reuse
