[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TusanHomichi/the-mortal-estate"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
tme-sim = { path = "crates/sim" }
tme-content = { path = "crates/content" }
tme-wire = { path = "crates/wire" }
tme-link = { path = "crates/link" }
tme-server = { path = "crates/server" }
tme-client = { path = "crates/client" }
# Pinned to one release, upgraded when we choose (renovate.json holds it).
# No audio yet, so no ALSA to link.
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
# No heapless: its CAS feature pulls in the unmaintained atomic-polyfill, and we only encode to Vec.
postcard = { version = "1", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
snow = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
tokio-tungstenite = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
