[workspace]
members = [
  "crates/tme-authoring",
  "crates/tme-protocol",
  "crates/tme-rules",
  "crates/tme-server",
  "crates/tme-sim",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "=0.10.9"
uuid = { version = "=1.23.5", features = ["serde"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "test-util"] }
axum = { version = "=0.8.9", features = ["ws", "http1", "tokio"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
argon2 = "=0.5.3"
base64 = "=0.22.1"
getrandom = "=0.4.3"
unicode-normalization = "=0.1.25"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "migrate"] }
rpassword = "=7.5.4"
